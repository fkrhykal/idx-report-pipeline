[project]
name = "idx"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "curl-cffi>=0.16.3",
    "dagster==1.13.24",
    "ixbrlparse>=0.11.2",
    "polars>=1.44.2",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = ["dagster-dg-cli", "dagster-webserver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "idx"
registry_modules = ["idx.components.*"]
